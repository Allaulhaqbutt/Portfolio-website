<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Project Name</h1>
        <p>Welcome to the project page!</p>
    </header>
    
    <main>
        <section id="project-details">
            <h2>Project Details</h2>
            <p>This is where you'll provide details about the project, its goals, technologies used, etc.</p>
        </section>

        <section id="gallery">
            <h2>Gallery</h2>
            <div class="image-container">
                <img src="image1.jpg" alt="Project screenshot 1">
                <img src="image2.jpg" alt="Project screenshot 2">
                <!-- Add more images as needed -->
            </div>
        </section>

        <section id="team">
            <h2>Project Team</h2>
            <p>Meet the team behind the project.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Project Name</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
